[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-auditor"
version = "3.1.0"
description = "Autonomous AI Swarm SAST/DAST Security Auditor with Red/Blue Team workflows"
requires-python = ">=3.11"
dependencies = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
]

[project.scripts]
swarm-audit = "swarm_auditor.engine:main"

[tool.setuptools.packages.find]
include = ["swarm_auditor*"]
